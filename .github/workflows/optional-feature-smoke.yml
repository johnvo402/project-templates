name: optional-feature-smoke

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: optional-feature-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated-frontends:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: react base
            project: OptionalReactBase
            arguments: --framework net9.0 --frontend react --minio false --ai none --filter false
            minio: false
            ai: none

          - label: react ai
            project: OptionalReactAi
            arguments: --framework net9.0 --frontend react --minio false --ai gemini --filter false
            minio: false
            ai: gemini

          - label: react storage
            project: OptionalReactStorage
            arguments: --framework net9.0 --frontend react --minio true --ai none --filter false
            minio: true
            ai: none

          - label: react ai storage
            project: OptionalReactAiStorage
            arguments: --framework net9.0 --frontend react --minio true --ai openai --filter false
            minio: true
            ai: openai

          - label: angular base
            project: OptionalAngularBase
            arguments: --framework net9.0 --frontend angular --minio false --ai none --filter false
            minio: false
            ai: none

          - label: angular ai
            project: OptionalAngularAi
            arguments: --framework net9.0 --frontend angular --minio false --ai gemini --filter false
            minio: false
            ai: gemini

          - label: angular storage
            project: OptionalAngularStorage
            arguments: --framework net9.0 --frontend angular --minio true --ai none --filter false
            minio: true
            ai: none

          - label: angular ai storage
            project: OptionalAngularAiStorage
            arguments: --framework net9.0 --frontend angular --minio true --ai openai --filter false
            minio: true
            ai: openai

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Generate project
        shell: bash
        run: |
          output="${RUNNER_TEMP}/optional-feature-smoke/${{ matrix.project }}"
          dotnet new install ./templates/clean-api
          dotnet new jv-api \
            -n "${{ matrix.project }}" \
            -o "$output" \
            ${{ matrix.arguments }} \
            --allow-scripts Yes
          echo "SMOKE_OUTPUT=$output" >> "$GITHUB_ENV"

      - name: Reject legacy frontend architecture
        shell: bash
        run: |
          forbidden_paths="$(find "$SMOKE_OUTPUT/frontend/src" -type f \( \
            -iname '*BusinessWorkspace*' \
            -o -name 'business-api.service.ts' \
            -o -name 'business-pagination.component.ts' \
            -o -name 'business.css' \
            -o -name 'business.routes.ts' \
            -o -path '*/features/business/business-query.ts' \
          \) -print || true)"
          forbidden_refs="$(grep -RInE --exclude-dir=node_modules \
            '(BusinessWorkspace|business-api\.service|business-pagination|business\.css|business\.routes|features[/\\]business[/\\]business-query|business[/\\]business-query)' \
            "$SMOKE_OUTPUT/frontend/src" || true)"
          if [ -n "$forbidden_paths$forbidden_refs" ]; then
            printf '%s\n%s\n' "$forbidden_paths" "$forbidden_refs"
            echo "Legacy business architecture returned in generated frontend output." >&2
            exit 1
          fi

      - name: Check MinIO boundary
        shell: bash
        run: |
          if [ "${{ matrix.minio }}" = "true" ]; then
            required_backend=(IObjectStorage.cs ProductImageModel.cs Product.storage.cs ProfileAvatarEndpointRegistration.cs)
            for name in "${required_backend[@]}"; do
              if ! find "$SMOKE_OUTPUT/src" -type f -name "$name" -print -quit | grep -q .; then
                echo "Expected MinIO artifact '$name' was not generated." >&2
                exit 1
              fi
            done

            if ! grep -RIlF "body.set('image', image)" "$SMOKE_OUTPUT/frontend/src" | grep -q .; then
              echo "MinIO is enabled but Product create/update does not send the inline image field." >&2
              exit 1
            fi

            legacy_backend="$(find "$SMOKE_OUTPUT/src" -type f \( \
              -name 'ProductImageEndpointRegistration.cs' \
              -o -name 'ProductImage.cs' \
              -o -name 'ProductImageConfiguration.cs' \
              -o -name 'ProductImageRequests.cs' \
              -o -name 'ProductImageHandlers.cs' \
            \) -print || true)"
            legacy_frontend="$(find "$SMOKE_OUTPUT/frontend/src" -type f \( \
              -name 'ProductImagesWorkspace.tsx' \
              -o -name 'product-images-workspace.component.ts' \
              -o -name 'product-images.api.ts' \
              -o -name 'product-images-api.service.ts' \
            \) -print || true)"
            legacy_wiring="$(grep -RInE --exclude-dir=node_modules '(ProductImagesWorkspace|product-images-workspace|/products/images|MapOptionalProductImageEndpoints)' "$SMOKE_OUTPUT" || true)"
            if [ -n "$legacy_backend$legacy_frontend$legacy_wiring" ]; then
              printf '%s\n%s\n%s\n' "$legacy_backend" "$legacy_frontend" "$legacy_wiring"
              echo "Standalone Product Images architecture returned in generated output." >&2
              exit 1
            fi
          else
            leaked_backend="$(find "$SMOKE_OUTPUT/src" -type f \( \
              -name 'IObjectStorage.cs' \
              -o -name 'ProductImageModel.cs' \
              -o -name 'Product.storage.cs' \
              -o -name 'ProfileAvatarEndpointRegistration.cs' \
              -o -name 'GeneratedOptionalEndpointRegistration.Minio.cs' \
              -o -name 'IEmployeeAvatarUrlResolver.cs' \
              -o -name 'EmployeeAvatarUrlResolver.cs' \
              -o -name 'MinioObjectStorage.cs' \
              -o -name 'MinioOptions.cs' \
              -o -name 'StorageRegistration.cs' \
            \) -print || true)"
            leaked_frontend="$(find "$SMOKE_OUTPUT/frontend/src" -type f \( \
              -name 'ProductImagesWorkspace.tsx' \
              -o -name 'product-images-workspace.component.ts' \
              -o -name 'product-images.api.ts' \
              -o -name 'product-images-api.service.ts' \
              -o -name 'avatar.api.ts' \
              -o -name 'avatar-api.service.ts' \
            \) -print || true)"
            leaked_wiring="$(grep -RInE --exclude-dir=node_modules \
              '(body\.set.*image|Product image|product-image|showProductImages|ProductImagesWorkspace|product-images-workspace)' \
              "$SMOKE_OUTPUT/frontend/src" || true)"
            if [ -n "$leaked_backend$leaked_frontend$leaked_wiring" ]; then
              printf '%s\n%s\n%s\n' "$leaked_backend" "$leaked_frontend" "$leaked_wiring"
              echo "MinIO/storage artifacts leaked into a --minio false generated project." >&2
              exit 1
            fi
          fi

      - name: Check AI boundary
        shell: bash
        run: |
          case "${{ matrix.ai }}" in
            gemini)
              if ! find "$SMOKE_OUTPUT/src" -type f -name 'GeminiAiService.cs' -print -quit | grep -q .; then
                echo "Gemini is enabled but GeminiAiService.cs is missing." >&2
                exit 1
              fi
              if find "$SMOKE_OUTPUT/src" -type f -name 'OpenAiService.cs' -print -quit | grep -q .; then
                echo "OpenAI implementation leaked into a Gemini project." >&2
                exit 1
              fi
              ;;
            openai)
              if ! find "$SMOKE_OUTPUT/src" -type f -name 'OpenAiService.cs' -print -quit | grep -q .; then
                echo "OpenAI is enabled but OpenAiService.cs is missing." >&2
                exit 1
              fi
              if find "$SMOKE_OUTPUT/src" -type f -name 'GeminiAiService.cs' -print -quit | grep -q .; then
                echo "Gemini implementation leaked into an OpenAI project." >&2
                exit 1
              fi
              ;;
            none)
              leaked_backend="$(find "$SMOKE_OUTPUT/src" -type f \( -name 'IAiService.cs' -o -name 'AiEndpointRegistration.cs' -o -iname '*Gemini*' -o -name 'OpenAiService.cs' \) -print || true)"
              leaked_frontend="$(find "$SMOKE_OUTPUT/frontend/src" -type f \( -name 'AiPanel.tsx' -o -name 'ai.page.ts' -o -name 'ai-api.service.ts' -o -name 'ai.store.ts' -o -name 'ai.api.ts' \) -print || true)"
              leaked_wiring="$(grep -RInE --exclude-dir=node_modules '(showAi|ai\.generate|features[/\\]ai)' "$SMOKE_OUTPUT/frontend/src" || true)"
              if [ -n "$leaked_backend$leaked_frontend$leaked_wiring" ]; then
                printf '%s\n%s\n%s\n' "$leaked_backend" "$leaked_frontend" "$leaked_wiring"
                echo "AI artifacts leaked into an --ai none generated project." >&2
                exit 1
              fi
              ;;
          esac

          if [ "${{ matrix.ai }}" != "none" ]; then
            for name in IAiService.cs AiEndpointRegistration.cs; do
              if ! find "$SMOKE_OUTPUT/src" -type f -name "$name" -print -quit | grep -q .; then
                echo "Expected AI artifact '$name' was not generated." >&2
                exit 1
              fi
            done
            if ! find "$SMOKE_OUTPUT/frontend/src" -type f \( -name 'AiPanel.tsx' -o -name 'ai.page.ts' \) -print -quit | grep -q .; then
              echo "AI is enabled but the frontend AI feature is missing." >&2
              exit 1
            fi
          fi

      - name: Restore backend
        run: dotnet restore "$SMOKE_OUTPUT/${{ matrix.project }}.sln"

      - name: Build backend
        run: dotnet build "$SMOKE_OUTPUT/${{ matrix.project }}.sln" -c Release --no-restore

      - name: Test backend
        run: dotnet test "$SMOKE_OUTPUT/${{ matrix.project }}.sln" -c Release --no-build --logger "console;verbosity=normal"

      - name: Install frontend dependencies
        working-directory: ${{ env.SMOKE_OUTPUT }}/frontend
        run: npm install

      - name: Build frontend
        working-directory: ${{ env.SMOKE_OUTPUT }}/frontend
        run: npm run build
