name: nuget-publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version override. Leave blank to use JV.ProjectTemplates.csproj.
        required: false
        type: string
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: nuget-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: pack smoke publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Resolve package version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' JV.ProjectTemplates.csproj | head -n 1)"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid NuGet package version: '$version'" >&2
            exit 1
          fi

          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
          echo "Publishing version $version"

      - name: Pack template
        run: dotnet pack JV.ProjectTemplates.csproj -c Release -o artifacts -p:PackageVersion="$PACKAGE_VERSION"

      - name: Verify package contents
        shell: bash
        run: |
          package="artifacts/JohnVo.ProjectTemplates.$PACKAGE_VERSION.nupkg"
          if [ ! -f "$package" ]; then
            echo "Expected package '$package' was not created." >&2
            exit 1
          fi

          python3 - "$package" <<'PY'
          import sys
          import zipfile

          path = sys.argv[1]
          required = {
              "README.md",
              "content/templates/clean-api/.template.config/template.json",
              "content/templates/clean-api/src/TemplateApp.Api/Program.cs",
          }

          with zipfile.ZipFile(path) as archive:
              names = set(archive.namelist())

          missing = sorted(required - names)
          if missing:
              raise SystemExit("Missing package entries: " + ", ".join(missing))
          PY

      - name: Install packed template
        shell: bash
        run: |
          dotnet new uninstall JohnVo.ProjectTemplates >/dev/null 2>&1 || true
          dotnet new install "artifacts/JohnVo.ProjectTemplates.$PACKAGE_VERSION.nupkg"

      - name: Generate package smoke project
        shell: bash
        run: |
          output="${RUNNER_TEMP}/nuget-package-smoke/NuGetSmoke"
          dotnet new jv-api \
            -n NuGetSmoke \
            -o "$output" \
            --framework net10.0 \
            --frontend react \
            --database postgresql \
            --redis true \
            --minio true \
            --ai openai \
            --filter true \
            --otel true \
            --docker true \
            --allow-scripts Yes
          echo "SMOKE_OUTPUT=$output" >> "$GITHUB_ENV"

      - name: Restore package smoke backend
        run: dotnet restore "$SMOKE_OUTPUT/NuGetSmoke.sln"

      - name: Build package smoke backend
        run: dotnet build "$SMOKE_OUTPUT/NuGetSmoke.sln" -c Release --no-restore

      - name: Test package smoke backend
        run: dotnet test "$SMOKE_OUTPUT/NuGetSmoke.sln" -c Release --no-build --logger "console;verbosity=normal"

      - name: Install package smoke frontend dependencies
        working-directory: ${{ env.SMOKE_OUTPUT }}/frontend
        run: npm install

      - name: Build package smoke frontend
        working-directory: ${{ env.SMOKE_OUTPUT }}/frontend
        run: npm run build

      - name: Upload NuGet artifact
        uses: actions/upload-artifact@v4
        with:
          name: JohnVo.ProjectTemplates-${{ env.PACKAGE_VERSION }}
          path: artifacts/*.nupkg
          if-no-files-found: error

      - name: Validate NuGet API key
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "Repository secret NUGET_API_KEY is required to publish to NuGet.org." >&2
            exit 1
          fi

      - name: Push package to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push "artifacts/JohnVo.ProjectTemplates.$PACKAGE_VERSION.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
