name: template-smoke

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: template-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  env-conventions:
    name: env conventions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Reject ASP.NET section keys in env examples
        shell: bash
        run: |
          matches="$(grep -RInE --include='.env*.example' '^[[:space:]]*#?[[:space:]]*[A-Za-z0-9_]+__[A-Za-z0-9_]+=' templates/clean-api || true)"
          if [ -n "$matches" ]; then
            echo "$matches"
            echo "Use UPPER_SNAKE_CASE aliases in .env example files; map them to canonical ASP.NET keys in Docker Compose." >&2
            exit 1
          fi

      - name: Reject dotenv loading and Docker aliases in backend C#
        shell: bash
        run: |
          matches="$(grep -RInE --include='*.cs' '(DotEnvLoader|AUTO_MIGRATE|DB_CONNECTION|JWT_(ISSUER|AUDIENCE|KEY|EXPIRATION_MINUTES)|REFRESH_(TOKEN_DAYS|COOKIE_NAME)|REDIS_(CONNECTION|INSTANCE_NAME)|MINIO_(PUBLIC_ENDPOINT|PUBLIC_SECURE|ACCESS_KEY|SECRET_KEY|BUCKET|PRESIGNED_EXPIRY_SECONDS)|GEMINI_(API_KEY|MODEL)|OPENAI_(API_KEY|MODEL))' templates/clean-api/src templates/clean-api/_variants || true)"
          if [ -n "$matches" ]; then
            echo "$matches"
            echo "The backend must not load .env files or use Docker-facing aliases; keep aliases in .env/Compose and use canonical ASP.NET/OpenTelemetry configuration." >&2
            exit 1
          fi

  generated-projects:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: net10 default
            project: SmokeNet10Default
            sdk: 10.0.x
            arguments: --framework net10.0
            frontend: false
            filter: false
            docker: false
            verifyRename: false

          - label: net10 postgres redis openai otel
            project: SmokeNet10OpenAi
            sdk: 10.0.x
            arguments: --framework net10.0 --database postgresql --redis true --minio false --ai openai --filter false --otel true --docker false
            frontend: false
            filter: false
            docker: false
            verifyRename: false

          - label: net9 all optional off
            project: SmokeNet9Off
            sdk: 9.0.x
            arguments: --framework net9.0 --database sqlserver --redis false --minio false --ai none --filter false --otel false --docker false
            frontend: false
            filter: false
            docker: false
            verifyRename: false

          - label: net9 sqlserver redis filter
            project: SmokeFilterRedis
            sdk: 9.0.x
            arguments: --framework net9.0 --database sqlserver --redis true --minio false --ai none --filter true --otel false --docker false
            frontend: false
            filter: true
            docker: false
            verifyRename: false

          - label: net9 postgres minio
            project: SmokeMinio
            sdk: 9.0.x
            arguments: --framework net9.0 --database postgresql --redis false --minio true --ai none --filter false --otel false --docker false
            frontend: false
            filter: false
            docker: false
            verifyRename: false

          - label: net9 opentelemetry no docker
            project: SmokeOpenTelemetry
            sdk: 9.0.x
            arguments: --framework net9.0 --database postgresql --redis false --minio false --ai none --filter false --otel true --docker false
            frontend: false
            filter: false
            docker: false
            verifyRename: false

          - label: net9 docker no opentelemetry
            project: SmokeDockerNoOtel
            sdk: 9.0.x
            arguments: --framework net9.0 --database sqlserver --redis false --minio false --ai none --filter false --otel false --docker true
            frontend: false
            filter: false
            docker: true
            verifyRename: false

          - label: net9 react full stack
            project: SmokeReactFull
            sdk: 9.0.x
            arguments: --framework net9.0 --frontend react --database postgresql --redis true --minio true --ai gemini --filter true --otel true --docker true
            frontend: true
            filter: true
            docker: true
            verifyRename: true

          - label: net9 react openai
            project: SmokeReactOpenAi
            sdk: 9.0.x
            arguments: --framework net9.0 --frontend react --database sqlserver --redis false --minio false --ai openai --filter false --otel false --docker false
            frontend: true
            filter: false
            docker: false
            verifyRename: true

          - label: net9 angular storage filter
            project: SmokeAngularStorage
            sdk: 9.0.x
            arguments: --framework net9.0 --frontend angular --database postgresql --redis false --minio true --ai none --filter true --otel false --docker false
            frontend: true
            filter: true
            docker: false
            verifyRename: true

          - label: net9 angular openai docker
            project: SmokeAngularOpenAi
            sdk: 9.0.x
            arguments: --framework net9.0 --frontend angular --database sqlserver --redis true --minio true --ai openai --filter false --otel true --docker true
            frontend: true
            filter: false
            docker: true
            verifyRename: true

          - label: net8 sqlserver
            project: SmokeNet8SqlServer
            sdk: 8.0.x
            arguments: --framework net8.0 --database sqlserver --redis false --minio false --ai none --filter false --otel false --docker false
            frontend: false
            filter: false
            docker: false
            verifyRename: false

          - label: net8 postgres optional stack
            project: SmokeNet8Options
            sdk: 8.0.x
            arguments: --framework net8.0 --database postgresql --redis true --minio true --ai openai --filter true --otel true --docker true
            frontend: false
            filter: true
            docker: true
            verifyRename: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ matrix.sdk }}

      - name: Setup .NET 10 for Aspire AppHost
        if: ${{ contains(matrix.arguments, '--otel true') && matrix.sdk != '10.0.x' }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        if: ${{ matrix.frontend }}
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install local template and generate project
        shell: bash
        run: |
          output="${RUNNER_TEMP}/template-smoke/${{ matrix.project }}"
          dotnet new install ./templates/clean-api
          dotnet new jv-api \
            -n "${{ matrix.project }}" \
            -o "$output" \
            ${{ matrix.arguments }} \
            --allow-scripts Yes
          echo "SMOKE_OUTPUT=$output" >> "$GITHUB_ENV"

      - name: Check generated repository declarations
        shell: pwsh
        run: ./tests/Assert-GeneratedRepositories.ps1 -ProjectRoot $env:SMOKE_OUTPUT

      - name: Reject legacy todo sample
        shell: bash
        run: |
          targets=("$SMOKE_OUTPUT/src")
          if [ -d "$SMOKE_OUTPUT/frontend" ]; then targets+=("$SMOKE_OUTPUT/frontend"); fi
          matches="$(grep -RInE --exclude-dir=node_modules --exclude-dir=bin --exclude-dir=obj '(Features[/\\]Todos|/api/todos|todos\.(read|write)|users\.(read|manage))' "${targets[@]}" || true)"
          if [ -n "$matches" ]; then
            echo "$matches"
            echo "Legacy Todo/Users starter artifacts must not appear in generated projects." >&2
            exit 1
          fi

      - name: Reject feature caching for orders and reporting
        shell: bash
        run: |
          matches="$(grep -RInE --include='*.cs' '(ICacheRepository|IDistributedCache|HybridCache)' "$SMOKE_OUTPUT/src" 2>/dev/null | grep -E '(Features/(Orders|Dashboard|Reports)/|Reporting/BusinessReportingService)' || true)"
          if [ -n "$matches" ]; then
            echo "$matches"
            echo "Orders, Dashboard and Reports must read operational data directly and must not depend on cache services." >&2
            exit 1
          fi

      - name: Check employee avatar boundary
        shell: bash
        run: |
          stale="$(grep -RInE --include='*.cs' '(NullEmployeeAvatarUrlResolver|MinioEmployeeAvatarUrlResolver)' "$SMOKE_OUTPUT/src" || true)"
          if [ -n "$stale" ]; then
            echo "$stale"
            echo "Employee avatar resolution must be employee-scoped and must not use legacy null/MinIO-specific resolver names." >&2
            exit 1
          fi

          if [[ "${{ matrix.arguments }}" != *"--minio true"* ]]; then
            leaked="$(grep -RInE --include='*.cs' '(IEmployeeAvatarUrlResolver|EmployeeAvatarUrlResolver|AvatarObjectName)' "$SMOKE_OUTPUT/src" || true)"
            if [ -n "$leaked" ]; then
              echo "$leaked"
              echo "Employee avatar storage plumbing must not be generated when MinIO is disabled." >&2
              exit 1
            fi
          fi

      - name: Check generated env boundary
        shell: bash
        run: |
          if [ "${{ matrix.docker }}" = "true" ]; then
            for file in "$SMOKE_OUTPUT/.env.example" "$SMOKE_OUTPUT/.env.production.example" "$SMOKE_OUTPUT/compose.yaml" "$SMOKE_OUTPUT/compose.prod.yaml"; do
              if [ ! -f "$file" ]; then
                echo "Docker is enabled but '$file' was not generated." >&2
                exit 1
              fi
            done
          else
            if [ -f "$SMOKE_OUTPUT/.env.example" ] || [ -f "$SMOKE_OUTPUT/.env.production.example" ]; then
              echo "Docker env examples must not be generated when Docker is disabled." >&2
              exit 1
            fi
            if find "$SMOKE_OUTPUT" -maxdepth 1 -type f -name 'compose*.y*ml' -print -quit | grep -q .; then
              echo "Compose files must not be generated when Docker is disabled." >&2
              exit 1
            fi
          fi

      - name: Validate generated Docker Compose
        if: ${{ matrix.docker }}
        shell: bash
        run: |
          files=(-f "$SMOKE_OUTPUT/compose.yaml")
          if [ -f "$SMOKE_OUTPUT/compose.minio.yaml" ]; then
            files+=(-f "$SMOKE_OUTPUT/compose.minio.yaml")
          fi
          if [ -f "$SMOKE_OUTPUT/compose.ai.yaml" ]; then
            files+=(-f "$SMOKE_OUTPUT/compose.ai.yaml")
          fi

          docker compose --env-file "$SMOKE_OUTPUT/.env.example" "${files[@]}" config >/dev/null
          docker compose --env-file "$SMOKE_OUTPUT/.env.production.example" -f "$SMOKE_OUTPUT/compose.prod.yaml" config >/dev/null

      - name: Check AI provider boundary
        shell: bash
        run: |
          if [[ "${{ matrix.arguments }}" == *"--ai none"* ]]; then
            leaked="$(find "$SMOKE_OUTPUT/src" -type f \( -name 'IAiService.cs' -o -name 'GeminiAiService.cs' -o -name 'OpenAiService.cs' \) -print || true)"
            if [ -n "$leaked" ]; then
              echo "$leaked"
              echo "AI artifacts leaked into an --ai none project." >&2
              exit 1
            fi
          elif [[ "${{ matrix.arguments }}" == *"--ai openai"* ]]; then
            if ! find "$SMOKE_OUTPUT/src" -type f -name 'OpenAiService.cs' -print -quit | grep -q .; then
              echo "OpenAI was selected but OpenAiService.cs is missing." >&2
              exit 1
            fi
            if find "$SMOKE_OUTPUT/src" -type f -name 'GeminiAiService.cs' -print -quit | grep -q .; then
              echo "Gemini implementation leaked into an OpenAI project." >&2
              exit 1
            fi
          else
            if ! find "$SMOKE_OUTPUT/src" -type f -name 'GeminiAiService.cs' -print -quit | grep -q .; then
              echo "Gemini is expected but GeminiAiService.cs is missing." >&2
              exit 1
            fi
            if find "$SMOKE_OUTPUT/src" -type f -name 'OpenAiService.cs' -print -quit | grep -q .; then
              echo "OpenAI implementation leaked into a Gemini project." >&2
              exit 1
            fi
          fi

      - name: Check Aspire observability boundary
        shell: bash
        run: |
          apphost="$SMOKE_OUTPUT/src/${{ matrix.project }}.AppHost/${{ matrix.project }}.AppHost.csproj"
          defaults="$SMOKE_OUTPUT/src/${{ matrix.project }}.ServiceDefaults/${{ matrix.project }}.ServiceDefaults.csproj"
          extensions="$SMOKE_OUTPUT/src/${{ matrix.project }}.ServiceDefaults/Extensions.cs"

          if [[ "${{ matrix.arguments }}" == *"--otel true"* ]]; then
            for file in "$apphost" "$defaults" "$extensions"; do
              if [ ! -f "$file" ]; then
                echo "Aspire observability is enabled but '$file' was not generated." >&2
                exit 1
              fi
            done

            if ! grep -q 'Aspire.AppHost.Sdk/13.5.4' "$apphost"; then
              echo "Aspire AppHost SDK 13.5.4 is missing." >&2
              exit 1
            fi

            if ! grep -q '<TargetFramework>net10.0</TargetFramework>' "$apphost"; then
              echo "Aspire AppHost must target net10.0." >&2
              exit 1
            fi

            for package in \
              Microsoft.Extensions.Http.Resilience \
              Microsoft.Extensions.ServiceDiscovery \
              OpenTelemetry.Extensions.Hosting \
              OpenTelemetry.Exporter.OpenTelemetryProtocol \
              OpenTelemetry.Instrumentation.AspNetCore \
              OpenTelemetry.Instrumentation.Http \
              OpenTelemetry.Instrumentation.Runtime; do
              if ! grep -q "PackageReference Include=\"$package\"" "$defaults"; then
                echo "ServiceDefaults is missing package '$package'." >&2
                exit 1
              fi
            done

            api_program="$SMOKE_OUTPUT/src/${{ matrix.project }}.Api/Program.cs"
            if ! grep -q 'builder.AddServiceDefaults();' "$api_program" || ! grep -q 'app.MapDefaultEndpoints();' "$api_program"; then
              echo "API is not wired to Aspire ServiceDefaults." >&2
              exit 1
            fi

            if find "$SMOKE_OUTPUT/src" -type f -name 'OpenTelemetryRegistration.cs' -print -quit | grep -q .; then
              echo "Legacy OpenTelemetryRegistration.cs must not be generated after Aspire migration." >&2
              exit 1
            fi

            if ! grep -q "${{ matrix.project }}.AppHost" "$SMOKE_OUTPUT/${{ matrix.project }}.sln" || \
               ! grep -q "${{ matrix.project }}.ServiceDefaults" "$SMOKE_OUTPUT/${{ matrix.project }}.sln"; then
              echo "Aspire projects are missing from the generated solution." >&2
              exit 1
            fi

            if [ "${{ matrix.docker }}" = "true" ]; then
              if ! grep -q 'aspire-dashboard:' "$SMOKE_OUTPUT/compose.yaml" || \
                 ! grep -q 'mcr.microsoft.com/dotnet/aspire-dashboard:latest' "$SMOKE_OUTPUT/compose.yaml"; then
                echo "Docker + Aspire must generate the local Aspire Dashboard service." >&2
                exit 1
              fi

              if ! grep -q 'http://aspire-dashboard:18889' "$SMOKE_OUTPUT/compose.yaml" || \
                 ! grep -q 'OTEL_EXPORTER_OTLP_ENDPOINT=http://aspire-dashboard:18889' "$SMOKE_OUTPUT/.env.example"; then
                echo "Docker API is not configured to export OTLP to the Aspire Dashboard." >&2
                exit 1
              fi

              if grep -q 'aspire-dashboard:' "$SMOKE_OUTPUT/compose.prod.yaml"; then
                echo "Production Compose must not bundle the development Aspire Dashboard." >&2
                exit 1
              fi

              for name in OTEL_SERVICE_NAME OTEL_EXPORTER_OTLP_ENDPOINT OTEL_EXPORTER_OTLP_PROTOCOL OTEL_EXPORTER_OTLP_HEADERS; do
                if ! grep -q "$name" "$SMOKE_OUTPUT/.env.production.example" || ! grep -q "$name" "$SMOKE_OUTPUT/compose.prod.yaml"; then
                  echo "Production Docker + OpenTelemetry is missing '$name' passthrough." >&2
                  exit 1
                fi
              done
            fi
          else
            leaked_projects="$(find "$SMOKE_OUTPUT/src" -maxdepth 1 -type d \( -name '*.AppHost' -o -name '*.ServiceDefaults' \) -print || true)"
            leaked_refs="$(grep -RIn --include='*.csproj' -E '(Aspire\.AppHost\.Sdk|OpenTelemetry\.|Microsoft\.Extensions\.ServiceDiscovery|Microsoft\.Extensions\.Http\.Resilience)' "$SMOKE_OUTPUT/src" || true)"
            if [ -n "$leaked_projects$leaked_refs" ]; then
              printf '%s\n%s\n' "$leaked_projects" "$leaked_refs"
              echo "Aspire/OpenTelemetry artifacts leaked into an --otel false project." >&2
              exit 1
            fi

            if [ "${{ matrix.docker }}" = "true" ]; then
              leaked_docker="$(grep -RInE '(aspire-dashboard|OTEL_(SERVICE_NAME|EXPORTER_OTLP_))' "$SMOKE_OUTPUT"/.env*.example "$SMOKE_OUTPUT"/compose*.y*ml 2>/dev/null || true)"
              if [ -n "$leaked_docker" ]; then
                echo "$leaked_docker"
                echo "Aspire/OpenTelemetry Docker configuration leaked into an --otel false project." >&2
                exit 1
              fi
            fi
          fi

      - name: Check filter-disabled output
        if: ${{ matrix.filter == false }}
        shell: bash
        run: |
          if grep -REn --include='*.cs' \
            'QueryParameters|QueryableQueryEvaluator|CursorCodec|LhsBracketQueryParser|FilterNode' \
            "$SMOKE_OUTPUT/src"; then
            echo "Filter-only infrastructure was generated with --filter false." >&2
            exit 1
          fi

      - name: Check full-stack template transformations
        if: ${{ matrix.verifyRename }}
        shell: bash
        run: |
          if find "$SMOKE_OUTPUT" -type d -name _variants -print -quit | grep -q .; then
            echo "The _variants source directory was copied into generated output." >&2
            exit 1
          fi
          if find "$SMOKE_OUTPUT" -type f \
            \( -name '*.cs' -o -name '*.csproj' -o -name '*.sln' \) \
            -print0 | xargs -0 grep -En 'TemplateApp[._/]' ; then
            echo "Untransformed TemplateApp references remain in generated project content." >&2
            exit 1
          fi

      - name: Restore backend
        run: dotnet restore "$SMOKE_OUTPUT/${{ matrix.project }}.sln"

      - name: Build backend
        run: dotnet build "$SMOKE_OUTPUT/${{ matrix.project }}.sln" -c Release --no-restore

      - name: Test backend
        run: dotnet test "$SMOKE_OUTPUT/${{ matrix.project }}.sln" -c Release --no-build --logger "console;verbosity=normal"

      - name: Install frontend dependencies
        if: ${{ matrix.frontend }}
        working-directory: ${{ env.SMOKE_OUTPUT }}/frontend
        run: npm install

      - name: Build frontend
        if: ${{ matrix.frontend }}
        working-directory: ${{ env.SMOKE_OUTPUT }}/frontend
        run: npm run build
