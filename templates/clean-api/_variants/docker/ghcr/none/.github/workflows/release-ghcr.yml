name: release-ghcr

on:
  push:
    tags:
      - "**"

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build GHCR image prefix
        id: names
        shell: bash
        run: |
          prefix="ghcr.io/${{ github.repository }}"
          prefix=$(printf '%s' "$prefix" | tr '[:upper:]' '[:lower:]')
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/TemplateApp.Api/Dockerfile
          push: true
          tags: |
            ${{ steps.names.outputs.prefix }}-api:prod
            ${{ steps.names.outputs.prefix }}-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
