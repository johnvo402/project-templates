services:
  api:
    image: "${GHCR_IMAGE_PREFIX:-ghcr.io/johnvo/templateapp}-api:${IMAGE_TAG:-prod}"
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__AutoMigrate: "${AUTO_MIGRATE:-true}"
      ConnectionStrings__Default: "Host=db;Port=5432;Database=TemplateApp;Username=postgres;Password=${DB_PASSWORD}"
      Jwt__Issuer: "${JWT_ISSUER:-TemplateApp}"
      Jwt__Audience: "${JWT_AUDIENCE:-TemplateApp.Client}"
      Jwt__Key: "${JWT_KEY}"
      Jwt__ExpirationMinutes: "${JWT_EXPIRATION_MINUTES:-15}"
      Auth__RefreshTokenDays: "${REFRESH_TOKEN_DAYS:-14}"
      Auth__RefreshCookieName: "${REFRESH_COOKIE_NAME:-refresh_token}"
#if (otel)
      OTEL_SERVICE_NAME: "${OTEL_SERVICE_NAME:-TemplateApp.Api}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      OTEL_EXPORTER_OTLP_PROTOCOL: "${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}"
      OTEL_EXPORTER_OTLP_HEADERS: "${OTEL_EXPORTER_OTLP_HEADERS:-}"
#endif
      Gemini__ApiKey: "${GEMINI_API_KEY:-}"
      Gemini__Model: "${GEMINI_MODEL:-}"
      OpenAI__ApiKey: "${OPENAI_API_KEY:-}"
      OpenAI__Model: "${OPENAI_MODEL:-}"
      Redis__Configuration: "${REDIS_CONNECTION:-redis:6379}"
      Redis__InstanceName: "${REDIS_INSTANCE_NAME:-TemplateApp:}"
    depends_on:
      - db
      - redis

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: TemplateApp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  frontend:
    image: "${GHCR_IMAGE_PREFIX:-ghcr.io/johnvo/templateapp}-frontend:${IMAGE_TAG:-prod}"
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - api

volumes:
  db_data: {}
  redis_data: {}
