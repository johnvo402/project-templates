services:
  api:
    image: "${GHCR_IMAGE_PREFIX:-ghcr.io/johnvo/templateapp}-api:${IMAGE_TAG:-prod}"
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=db;Port=5432;Database=TemplateApp;Username=postgres;Password=${DB_PASSWORD}"
      Jwt__Key: "${JWT_KEY}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-}"
      Gemini__ApiKey: "${Gemini__ApiKey:-}"
      Gemini__Model: "${Gemini__Model:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-}"
      OpenAI__ApiKey: "${OpenAI__ApiKey:-}"
      OpenAI__Model: "${OpenAI__Model:-}"
      Redis__Configuration: redis:6379
    depends_on:
      - db
      - redis

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: TemplateApp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  frontend:
    image: "${GHCR_IMAGE_PREFIX:-ghcr.io/johnvo/templateapp}-frontend:${IMAGE_TAG:-prod}"
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - api

volumes:
  db_data: {}
  redis_data: {}
