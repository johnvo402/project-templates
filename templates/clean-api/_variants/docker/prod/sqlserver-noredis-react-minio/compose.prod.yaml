services:
  api:
    image: "${GHCR_IMAGE_PREFIX:-ghcr.io/johnvo/templateapp}-api:${IMAGE_TAG:-prod}"
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__AutoMigrate: "${AUTO_MIGRATE:-true}"
      ConnectionStrings__Default: "Server=db,1433;Database=TemplateApp;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True"
      Jwt__Issuer: "${JWT_ISSUER:-TemplateApp}"
      Jwt__Audience: "${JWT_AUDIENCE:-TemplateApp.Client}"
      Jwt__Key: "${JWT_KEY}"
      Jwt__ExpirationMinutes: "${JWT_EXPIRATION_MINUTES:-15}"
      Auth__RefreshTokenDays: "${REFRESH_TOKEN_DAYS:-14}"
      Auth__RefreshCookieName: "${REFRESH_COOKIE_NAME:-refresh_token}"
#if (otel)
      OTEL_SERVICE_NAME: "${OTEL_SERVICE_NAME:-TemplateApp.Api}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      OTEL_EXPORTER_OTLP_PROTOCOL: "${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}"
      OTEL_EXPORTER_OTLP_HEADERS: "${OTEL_EXPORTER_OTLP_HEADERS:-}"
#endif
      Gemini__ApiKey: "${GEMINI_API_KEY:-}"
      Gemini__Model: "${GEMINI_MODEL:-}"
      OpenAI__ApiKey: "${OPENAI_API_KEY:-}"
      OpenAI__Model: "${OPENAI_MODEL:-}"
      Minio__Endpoint: minio:9000
      Minio__PublicEndpoint: "${MINIO_PUBLIC_ENDPOINT}"
      Minio__AccessKey: "${MINIO_ACCESS_KEY}"
      Minio__SecretKey: "${MINIO_SECRET_KEY}"
      Minio__Secure: "false"
      Minio__PublicSecure: "${MINIO_PUBLIC_SECURE:-false}"
      Minio__Bucket: "${MINIO_BUCKET:-templateapp}"
      Minio__PresignedExpirySeconds: "${MINIO_PRESIGNED_EXPIRY_SECONDS:-900}"
    depends_on:
      - db
      - minio

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - db_data:/var/opt/mssql

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    restart: unless-stopped
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY}"
    volumes:
      - minio_data:/data

  frontend:
    image: "${GHCR_IMAGE_PREFIX:-ghcr.io/johnvo/templateapp}-frontend:${IMAGE_TAG:-prod}"
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - api

volumes:
  db_data: {}
  minio_data: {}
