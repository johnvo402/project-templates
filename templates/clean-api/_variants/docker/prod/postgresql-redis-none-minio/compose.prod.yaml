services:
  api:
    image: "${GHCR_IMAGE_PREFIX:-ghcr.io/johnvo/templateapp}-api:${IMAGE_TAG:-prod}"
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__AutoMigrate: "${AUTO_MIGRATE:-true}"
      ConnectionStrings__Default: "Host=db;Port=5432;Database=TemplateApp;Username=postgres;Password=${DB_PASSWORD}"
      Jwt__Issuer: "${JWT_ISSUER:-TemplateApp}"
      Jwt__Audience: "${JWT_AUDIENCE:-TemplateApp.Client}"
      Jwt__Key: "${JWT_KEY}"
      Jwt__ExpirationMinutes: "${JWT_EXPIRATION_MINUTES:-15}"
      Auth__RefreshTokenDays: "${REFRESH_TOKEN_DAYS:-14}"
      Auth__RefreshCookieName: "${REFRESH_COOKIE_NAME:-refresh_token}"
      Gemini__ApiKey: "${GEMINI_API_KEY:-}"
      Gemini__Model: "${GEMINI_MODEL:-}"
      OpenAI__ApiKey: "${OPENAI_API_KEY:-}"
      OpenAI__Model: "${OPENAI_MODEL:-}"
      Redis__Configuration: "${REDIS_CONNECTION:-redis:6379}"
      Redis__InstanceName: "${REDIS_INSTANCE_NAME:-TemplateApp:}"
      Minio__Endpoint: minio:9000
      Minio__PublicEndpoint: "${MINIO_PUBLIC_ENDPOINT}"
      Minio__AccessKey: "${MINIO_ACCESS_KEY}"
      Minio__SecretKey: "${MINIO_SECRET_KEY}"
      Minio__Secure: "false"
      Minio__PublicSecure: "${MINIO_PUBLIC_SECURE:-false}"
      Minio__Bucket: "${MINIO_BUCKET:-templateapp}"
      Minio__PresignedExpirySeconds: "${MINIO_PRESIGNED_EXPIRY_SECONDS:-900}"
    depends_on:
      - db
      - redis
      - minio

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: TemplateApp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    restart: unless-stopped
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY}"
    volumes:
      - minio_data:/data

volumes:
  db_data: {}
  redis_data: {}
  minio_data: {}
