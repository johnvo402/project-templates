services:
  api:
    image: "${GHCR_IMAGE_PREFIX:-ghcr.io/johnvo/templateapp}-api:${IMAGE_TAG:-prod}"
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=db;Port=5432;Database=TemplateApp;Username=postgres;Password=${DB_PASSWORD}"
      Jwt__Key: "${JWT_KEY}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-}"
      Gemini__ApiKey: "${Gemini__ApiKey:-}"
      Gemini__Model: "${Gemini__Model:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-}"
      OpenAI__ApiKey: "${OpenAI__ApiKey:-}"
      OpenAI__Model: "${OpenAI__Model:-}"
      Minio__Endpoint: minio:9000
      Minio__PublicEndpoint: "${MINIO_PUBLIC_ENDPOINT}"
      Minio__AccessKey: "${MINIO_ROOT_USER}"
      Minio__SecretKey: "${MINIO_ROOT_PASSWORD}"
      Minio__Secure: "false"
      Minio__PublicSecure: "${MINIO_PUBLIC_SECURE:-false}"
      Minio__Bucket: "${MINIO_BUCKET:-templateapp}"
    depends_on:
      - db
      - minio

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: TemplateApp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - db_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    restart: unless-stopped
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
    volumes:
      - minio_data:/data

volumes:
  db_data: {}
  minio_data: {}
