services:
  api:
    image: "${GHCR_IMAGE_PREFIX:-ghcr.io/johnvo/templateapp}-api:${IMAGE_TAG:-prod}"
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Server=db,1433;Database=TemplateApp;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True"
      Jwt__Key: "${JWT_KEY}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-}"
      Gemini__ApiKey: "${Gemini__ApiKey:-}"
      Gemini__Model: "${Gemini__Model:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-}"
      OpenAI__ApiKey: "${OpenAI__ApiKey:-}"
      OpenAI__Model: "${OpenAI__Model:-}"
      Redis__Configuration: redis:6379
      Minio__Endpoint: minio:9000
      Minio__PublicEndpoint: "${MINIO_PUBLIC_ENDPOINT}"
      Minio__AccessKey: "${MINIO_ROOT_USER}"
      Minio__SecretKey: "${MINIO_ROOT_PASSWORD}"
      Minio__Secure: "false"
      Minio__PublicSecure: "${MINIO_PUBLIC_SECURE:-false}"
      Minio__Bucket: "${MINIO_BUCKET:-templateapp}"
    depends_on:
      - db
      - redis
      - minio

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - db_data:/var/opt/mssql

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    restart: unless-stopped
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
    volumes:
      - minio_data:/data

  frontend:
    image: "${GHCR_IMAGE_PREFIX:-ghcr.io/johnvo/templateapp}-frontend:${IMAGE_TAG:-prod}"
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - api

volumes:
  db_data: {}
  redis_data: {}
  minio_data: {}
