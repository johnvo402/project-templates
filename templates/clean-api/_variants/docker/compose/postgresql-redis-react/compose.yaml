services:
  api:
    build:
      context: .
      dockerfile: src/TemplateApp.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__AutoMigrate: "${AUTO_MIGRATE:-true}"
      ConnectionStrings__Default: "Host=db;Port=5432;Database=TemplateApp;Username=postgres;Password=${DB_PASSWORD:-postgres}"
      Jwt__Issuer: "${JWT_ISSUER:-TemplateApp}"
      Jwt__Audience: "${JWT_AUDIENCE:-TemplateApp.Client}"
      Jwt__Key: "${JWT_KEY:-TemplateApp-compose-development-key-change-me-123456789}"
      Jwt__ExpirationMinutes: "${JWT_EXPIRATION_MINUTES:-15}"
      Auth__RefreshTokenDays: "${REFRESH_TOKEN_DAYS:-14}"
      Auth__RefreshCookieName: "${REFRESH_COOKIE_NAME:-refresh_token}"
#if (otel)
      OTEL_SERVICE_NAME: "${OTEL_SERVICE_NAME:-TemplateApp.Api}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://aspire-dashboard:18889}"
      OTEL_EXPORTER_OTLP_PROTOCOL: "${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}"
      OTEL_EXPORTER_OTLP_HEADERS: "${OTEL_EXPORTER_OTLP_HEADERS:-}"
#endif
      Redis__Configuration: redis:6379
      Redis__InstanceName: "${REDIS_INSTANCE_NAME:-TemplateApp:}"
    ports:
      - "5000:8080"
    depends_on:
      - db
      - redis

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: TemplateApp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${DB_PASSWORD:-postgres}"
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api

#if (otel)
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "127.0.0.1:18888:18888"
      - "127.0.0.1:4317:18889"
      - "127.0.0.1:4318:18890"
#endif

volumes:
  db_data: {}
