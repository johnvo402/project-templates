services:
  api:
    build:
      context: .
      dockerfile: src/TemplateApp.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=db;Port=5432;Database=TemplateApp;Username=postgres;Password=${DB_PASSWORD:-postgres}"
      Jwt__Key: "${JWT_KEY:-TemplateApp-compose-development-key-change-me-123456789}"
    ports:
      - "5000:8080"
    depends_on:
      - db

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: TemplateApp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${DB_PASSWORD:-postgres}"
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  db_data: {}
