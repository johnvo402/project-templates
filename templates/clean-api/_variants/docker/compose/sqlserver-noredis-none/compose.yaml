services:
  api:
    build:
      context: .
      dockerfile: src/TemplateApp.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__AutoMigrate: "${AUTO_MIGRATE:-true}"
      ConnectionStrings__Default: "Server=db,1433;Database=TemplateApp;User Id=sa;Password=${DB_PASSWORD:-TemplateStrong!123};TrustServerCertificate=True"
      Jwt__Issuer: "${JWT_ISSUER:-TemplateApp}"
      Jwt__Audience: "${JWT_AUDIENCE:-TemplateApp.Client}"
      Jwt__Key: "${JWT_KEY:-TemplateApp-compose-development-key-change-me-123456789}"
      Jwt__ExpirationMinutes: "${JWT_EXPIRATION_MINUTES:-15}"
      Auth__RefreshTokenDays: "${REFRESH_TOKEN_DAYS:-14}"
      Auth__RefreshCookieName: "${REFRESH_COOKIE_NAME:-refresh_token}"
#if (otel)
      OTEL_SERVICE_NAME: "${OTEL_SERVICE_NAME:-TemplateApp.Api}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      OTEL_EXPORTER_OTLP_PROTOCOL: "${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}"
      OTEL_EXPORTER_OTLP_HEADERS: "${OTEL_EXPORTER_OTLP_HEADERS:-}"
#endif
    ports:
      - "5000:8080"
    depends_on:
      - db

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD:-TemplateStrong!123}"
    ports:
      - "1433:1433"
    volumes:
      - db_data:/var/opt/mssql

volumes:
  db_data: {}
