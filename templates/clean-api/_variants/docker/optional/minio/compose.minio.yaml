services:
  api:
    environment:
      Minio__Endpoint: minio:9000
      Minio__PublicEndpoint: "${MINIO_PUBLIC_ENDPOINT:-localhost:9000}"
      Minio__AccessKey: "${MINIO_ACCESS_KEY:-minioadmin}"
      Minio__SecretKey: "${MINIO_SECRET_KEY:-minioadmin}"
      Minio__Bucket: "${MINIO_BUCKET:-templateapp}"
      Minio__Secure: "false"
      Minio__PublicSecure: "${MINIO_PUBLIC_SECURE:-false}"
      Minio__PresignedExpirySeconds: "${MINIO_PRESIGNED_EXPIRY_SECONDS:-900}"
    depends_on:
      - minio

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY:-minioadmin}"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  minio_data:
