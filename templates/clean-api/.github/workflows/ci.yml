name: ci

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect target framework
        id: dotnet
        shell: bash
        run: |
          tfm=$(sed -n 's:.*<TargetFramework>\(net[0-9][0-9]*\.0\)</TargetFramework>.*:\1:p' Directory.Build.props | head -n 1)
          if [ -z "$tfm" ]; then
            echo "Could not detect TargetFramework from Directory.Build.props" >&2
            exit 1
          fi
          echo "version=${tfm#net}.x" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ steps.dotnet.outputs.version }}

      - name: Restore
        run: dotnet restore TemplateApp.sln

      - name: Build
        run: dotnet build TemplateApp.sln -c Release --no-restore

      - name: Test
        run: dotnet test TemplateApp.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Setup Node
        if: ${{ hashFiles('frontend/package.json') != '' }}
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Build frontend
        if: ${{ hashFiles('frontend/package.json') != '' }}
        working-directory: frontend
        run: |
          npm install
          npm run build
